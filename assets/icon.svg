<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="screen">
      <rect x="362" y="302" width="300" height="420" rx="52"/>
    </clipPath>
  </defs>

  <!-- macOS icon body: 824 px square with a 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#14151A" filter="url(#shadow)"/>

  <!-- One screen, cut by a diagonal of light -->
  <g clip-path="url(#screen)">
    <rect x="362" y="302" width="300" height="420" fill="#6C8CFF"/>
    <polygon points="362,302 662,302 662,372 362,652" fill="#F2F3F7"/>
  </g>
</svg>
